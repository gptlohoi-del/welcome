<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilingual Temple Guide (Mobile Optimized)</title>
    <!-- Tải thư viện Mammoth.js để đọc file Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 15px;
            background: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section-title {
            color: #1a4a38;
            margin-top: 40px;
            border-bottom: 2px solid #eef0eb;
            padding-bottom: 10px;
            text-align: center;
        }
        
        /* Cấu trúc chia cột mặc định cho màn hình máy tính */
        .split-row {
            display: flex;
            border-bottom: 1px dashed #eaeaea;
            padding: 20px 0;
            gap: 40px;
        }
        .split-row:last-child {
            border-bottom: none;
        }
        .col { flex: 1; min-width: 0; }
        .en-col p { color: #2c3e50; font-size: 1.1em; margin: 0 0 10px 0; }
        .vi-col p { color: #555; font-style: italic; margin: 0 0 10px 0; }
        
        /* Thanh công cụ đã bỏ thuộc tính sticky */
        .top-bar {
            background: #1a4a38; color: white;
            padding: 15px 20px; border-radius: 8px; display: flex; align-items: center; flex-wrap: wrap;
            gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 25px;
        }
        .top-bar input { width: 50px; padding: 5px 10px; font-size: 16px; border-radius: 4px; border: none; outline: none; text-align: center;}
        
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: #f2f3f5; color: #333;
            padding: 15px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; z-index: 1000; font-size: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            min-width: 250px; transform: translateY(20px); border-left: 5px solid #d35400;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .dict-title { font-size: 1.4em; font-weight: bold; color: #d35400; margin-bottom: 2px; text-transform: capitalize; }
        .dict-phonetic { color: #7f8c8d; font-size: 1.1em; margin-bottom: 10px; font-family: monospace;}
        .dict-meaning { font-size: 1.05em; color: #2c3e50; }
        .dict-status { margin-top: 10px; font-size: 0.9em; color: #95a5a6; font-style: italic; }
        
        .clickable-word { cursor: pointer; color: #2980b9; transition: all 0.2s; display: inline-block; border-bottom: 1px dotted #2980b9; }
        .clickable-word:hover { background: #e1f0fa; border-radius: 3px; border-bottom: none;}
        .grid-header { display: flex; background: #e1f0fa; padding: 10px 0; border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #2c3e50; }
        .grid-header .col { padding: 0 20px; }
        
        .footer { margin-top: 40px; padding: 20px; text-align: center; border-top: 1px solid #eaeaea; background-color: #fff; border-radius: 8px; }
        .footer a { color: #2980b9; text-decoration: none; font-size: 1em; font-weight: 500; word-break: break-all;}
        .copy-btn { margin-top: 10px; padding: 8px 16px; background-color: #1a4a38; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        #loading { text-align: center; font-size: 1.1em; color: #1a4a38; padding: 40px 10px; font-weight: bold; }

        /* TỐI ƯU HÓA CHO ĐIỆN THOẠI (Mobile Responsive) */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            
            /* Chuyển cột ngang thành dọc xếp chồng lên nhau */
            .split-row {
                flex-direction: column;
                gap: 10px;
                padding: 15px 0;
            }
            .grid-header {
                display: none; /* Ẩn thanh tiêu đề cột trên điện thoại */
            }
            .vi-col {
                border-left: 3px solid #1a4a38;
                padding-left: 12px;
                background-color: #fafafa;
                padding-top: 8px;
                padding-bottom: 8px;
                border-radius: 0 4px 4px 0;
            }
            .vi-col p { margin-bottom: 5px; }
            
            /* Tùy chỉnh thanh top-bar cho màn hình nhỏ */
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                font-size: 0.95em;
            }
            .top-bar span {
                font-size: 0.85em;
                opacity: 0.9;
            }
            
            /* Tùy chỉnh khung popup từ điển */
            .toast {
                right: 15px;
                left: 15px;
                bottom: 20px;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Thanh công cụ giờ đây sẽ trôi theo trang web -->
        <div class="top-bar">
            <div>
                <label for="repeat-n">Số lần đọc: </label>
                <input type="number" id="repeat-n" value="3" min="1" max="20">
            </div>
            <span>Hướng dẫn: Chạm vào từ tiếng Anh để tra từ điển & nghe phát âm!</span>
        </div>
        
        <!-- Tiêu đề cột sẽ tự động ẩn trên màn hình điện thoại -->
        <div class="grid-header">
            <div class="col">English (Tiếng Anh)</div>
            <div class="col">Vietnamese (Tiếng Việt)</div>
        </div>

        <div id="loading">Đang tải dữ liệu từ file DOCX trên GitHub... Vui lòng chờ.</div>
        <div id="content"></div>
        
        <div class="footer">
            <div><a href="https://gptlohoi-del.github.io/welcome/" target="_blank" id="footer-link">https://gptlohoi-del.github.io/welcome/</a></div>
            <button class="copy-btn" onclick="copyFooterLink()">Copy link</button>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // 1. ĐƯỜNG LINK GITHUB RAW CỦA FILE DOCX
        // ==========================================
        const DOCX_URL = "https://raw.githubusercontent.com/gptlohoi-del/welcome/main/file%20in%20%20S%E1%BB%95%20A5%20l%C3%B2%20xo%20edtited%2004.05.2024.docx"; 

        // ==========================================
        // TẢI VÀ XỬ LÝ DỮ LIỆU TỪ FILE DOCX
        // ==========================================
        async function loadDocxFromGithub() {
            try {
                const response = await fetch(DOCX_URL);
                if (!response.ok) throw new Error("Không thể tải file DOCX. Hãy kiểm tra lại link RAW.");
                
                const arrayBuffer = await response.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
                const rawText = result.value;
                
                renderContent(rawText);
            } catch (error) {
                document.getElementById('loading').innerHTML = `<span style="color:red">Lỗi: ${error.message}<br>Đảm bảo link bạn dán là link RAW của GitHub và Repository đang ở chế độ Public.</span>`;
            }
        }

        function renderContent(rawText) {
            const viChars = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
            const headers = ['TOPIC', 'PART', 'I.', 'II.', 'III.', 'TABLE OF CONTENTS', 'ENGLISH', 'VIETNAMESE', 'TALKING about', 'OUR TEMPLE', 'Name:'];
            
            let rows = [];
            let currentEn = [];
            let currentVi = [];

            const lines = rawText.split('\n');
            
            for (let line of lines) {
                line = line.trim();
                if (!line || line === '|') continue;
                if (line.startsWith('| ')) line = line.substring(2);

                if (line.includes(' | ')) {
                    if (currentEn.length || currentVi.length) {
                        rows.push({en: currentEn, vi: currentVi});
                        currentEn = []; currentVi = [];
                    }
                    let parts = line.split(' | ');
                    rows.push({en: [parts[0].trim()], vi: [parts[1].trim()]});
                    continue;
                }

                let isHeader = headers.some(h => line.startsWith(h) || line.includes(h));
                
                if (isHeader) {
                    if (currentEn.length || currentVi.length) {
                        rows.push({en: currentEn, vi: currentVi});
                        currentEn = []; currentVi = [];
                    }
                    rows.push({header: line});
                } else if (viChars.test(line)) {
                    currentVi.push(line);
                } else {
                    if (currentVi.length) { 
                        rows.push({en: currentEn, vi: currentVi});
                        currentEn = []; currentVi = [];
                    }
                    currentEn.push(line);
                }
            }
            if (currentEn.length || currentVi.length) rows.push({en: currentEn, vi: currentVi});

            let html = '';
            for (let r of rows) {
                if (r.header) {
                    if (r.header.includes("ENGLISH") || r.header.includes("VIETNAMESE") || r.header.includes("TABLE OF CONTENTS")) continue;
                    html += `<h2 class="section-title">${r.header}</h2>`;
                } else {
                    let enHtml = r.en.map(p => `<p>${p}</p>`).join('');
                    let viHtml = r.vi.map(p => `<p>${p}</p>`).join('');
                    if (enHtml || viHtml) {
                        html += `<div class="split-row"><div class="col en-col">${enHtml}</div><div class="col vi-col">${viHtml}</div></div>`;
                    }
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').innerHTML = html;
            
            setupInteractiveDictionary();
        }

        // ==========================================
        // CÁC CHỨC NĂNG TƯƠNG TÁC
        // ==========================================
        function copyFooterLink() {
            navigator.clipboard.writeText("https://gptlohoi-del.github.io/welcome/").then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = "Đã copy!";
                btn.style.backgroundColor = "#27ae60";
                setTimeout(() => { btn.textContent = "Copy link"; btn.style.backgroundColor = "#1a4a38"; }, 2000);
            });
        }

        let currentPlayId = 0;
        let currentAudio = null;

        function setupInteractiveDictionary() {
            const enCols = document.querySelectorAll('.en-col');
            enCols.forEach(col => {
                const walk = document.createTreeWalker(col, NodeFilter.SHOW_TEXT, null, false);
                const nodesToWrap = [];
                let n;
                while(n = walk.nextNode()) nodesToWrap.push(n);
                
                nodesToWrap.forEach(node => {
                    const text = node.textContent;
                    const regex = /([a-zA-Z]+)/g;
                    if (regex.test(text) && node.parentNode && !node.parentNode.classList.contains('clickable-word')) {
                        const span = document.createElement('span');
                        span.innerHTML = text.replace(regex, '<span class="clickable-word">$1</span>');
                        node.parentNode.replaceChild(span, node);
                    }
                });
            });

            const toast = document.getElementById('toast');
            let timeout;

            async function fetchDetails(word) {
                let phonetic = ''; let translation = '';
                let searchWords = [word];
                if (word.endsWith('s') && word.length > 3) searchWords.push(word.slice(0, -1));
                if (word.endsWith('ed') && word.length > 4) searchWords.push(word.slice(0, -2));
                if (word.endsWith('ing') && word.length > 4) searchWords.push(word.slice(0, -3));

                for (let w of searchWords) {
                    if (phonetic) break;
                    try {
                        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`);
                        if(dictRes.ok) {
                            const dictData = await dictRes.json();
                            if (dictData && dictData.length > 0) {
                                phonetic = dictData[0].phonetic || '';
                                if (!phonetic && dictData[0].phonetics) {
                                    const p = dictData[0].phonetics.find(x => x.text);
                                    if (p) phonetic = p.text;
                                }
                            }
                        }
                    } catch (e) { }
                }

                try {
                    const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${word}`);
                    const transData = await transRes.json();
                    if (transData && transData[0] && transData[0][0]) translation = transData[0][0][0];
                } catch (e) { }
                return { phonetic, translation };
            }

            async function playAudio(word, n) {
                currentPlayId++;
                let myPlayId = currentPlayId;

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                window.speechSynthesis.cancel();

                const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(word)}`;
                
                for (let i = 0; i < n; i++) {
                    if (myPlayId !== currentPlayId) break;

                    try {
                        currentAudio = new Audio(audioUrl);
                        await new Promise((resolve, reject) => {
                            currentAudio.onended = resolve; 
                            currentAudio.onerror = reject; 
                            currentAudio.play().catch(reject);
                        });
                    } catch (e) {
                        if (myPlayId !== currentPlayId) break;
                        let utterance = new SpeechSynthesisUtterance(word);
                        utterance.lang = 'en-US'; 
                        window.speechSynthesis.speak(utterance);
                        await new Promise(r => { utterance.onend = r; utterance.onerror = r; });
                    }
                    
                    if (myPlayId !== currentPlayId) break;
                    await new Promise(r => setTimeout(r, 600));
                }
            }

            document.body.addEventListener('click', async (e) => {
                if(!e.target || !e.target.classList) return; 
                
                if(e.target.classList.contains('clickable-word')) {
                    let n = parseInt(document.getElementById('repeat-n').value) || 1;
                    if(n > 20) n = 20; if(n < 1) n = 1;
                    
                    let originalWord = e.target.textContent;
                    let word = originalWord.toLowerCase().replace(/[^a-z]/g, '');
                    if(!word) return;

                    let dummy = new SpeechSynthesisUtterance('');
                    dummy.volume = 0; window.speechSynthesis.speak(dummy);

                    toast.innerHTML = `<div class="dict-status">Đang tra cứu...</div>`;
                    toast.classList.add('show');
                    clearTimeout(timeout);
                    
                    const { phonetic, translation } = await fetchDetails(word);
                    
                    toast.innerHTML = `
                        <div class="dict-title">${originalWord}</div>
                        <div class="dict-phonetic">${phonetic ? phonetic : ''}</div>
                        <div class="dict-meaning"><b>Nghĩa:</b> ${translation ? translation : ''}</div>
                        <div class="dict-status">🔊 <i>Đang phát âm ${n} lần...</i></div>
                    `;
                    
                    timeout = setTimeout(() => { toast.classList.remove('show'); }, Math.max(5000, n * 1500));
                    playAudio(word, n);
                }
            });
        }

        // Tải dữ liệu ngay khi mở trang
        loadDocxFromGithub();
    </script>
</body>
</html>
